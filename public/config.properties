# ==============================================
# 保底进度配置文件
# 每行一条，格式：key = value（# 开头为注释行）
#
# 进度计算规则：
#   百分比 = (已消耗纠缠之缘数量 * 160 + 剩余原石数量) / 14400 * 100%
#   以 14400 原石为 100%，结果保留两位小数
#
# name 为可选配置，用于页面上显示的角色名；不填则默认显示 userA / userB
# history 是进度的唯一数据源，格式为：日期,纠缠之缘,原石
# 多条记录使用英文分号分隔；首页水杯和百分比均读取日期最新的节点
# ==============================================

# ---- userA ----
userA.name = HaoYanran
userA.history = 2026-08-02,1,160; 2026-08-09,2,320; 2026-08-16,3,480; 2026-08-23,5,640; 2026-08-30,6,2039

# ---- userB ----
userB.name = HaoHan
userB.history = 2026-08-02,3,0; 2026-08-09,6,0; 2026-08-16,8,80; 2026-08-23,12,0; 2026-08-30,21,1673
